# Base configuration — all training configs inherit from this.
# Override fields in stage-specific YAML files.

model:
  backbone: configs/model/backbone_0_6b.yaml

data:
  tokenized_dir: data/tokenized/
  manifests_dir: data/manifests/
  num_workers: 4
  prefetch_factor: 2

training:
  seed: 42
  bf16: true
  gradient_clip: 1.0
  log_every_n_steps: 50
  save_every_n_steps: 1000
  eval_every_n_steps: 5000

wandb:
  project: qwenfpt-tts
  # api_key: loaded from WANDB_API_KEY env var — never hardcode here

deepspeed:
  zero_stage: 2
  offload_optimizer: false
  offload_param: false
